{% extends 'main/pattern.html' %}
{% load static %}

{% block title %}Общая статистика{% endblock %}

{% block css %}
    <link rel="stylesheet" href="{% static 'skills/css/skills.css' %}">
{% endblock %}

{% block content %}
    {% for i in stats %}
        <h1 class="skills-title">{{ i.name }}</h1>
        <div class="info-card">
            <div class="table">
                <table class="skills-table">
                    <caption>{{ i.name }}</caption>
                    <tbody class="skills-table-body">
                        {% for k, v in i.table.items %}
                            <tr class="skills-table-body-line">
                                <td>{{k}}</td>
                                <td>{{v}}</td>
                            </tr>
                        {% endfor %}
                    </tbody>
                </table>
            </div>
            <div class="chart">
                <img src="{{ i.chart.url }}">
            </div>
        </div>
    {% endfor %}
{% endblock %}
